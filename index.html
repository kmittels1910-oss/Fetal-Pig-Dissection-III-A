<title>Virtual Dissection: Fetal Pig</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background:#f0f0f0; margin:0; padding:16px; display:flex; justify-content:center; }
  .lab { width:100%; max-width:1000px; background:linear-gradient(135deg,#10344b 0%,#1c5270 50%,#447b99 100%); border-radius:12px; padding:20px; color:#fff; box-shadow:0 10px 30px rgba(0,0,0,.3); }
  h1 { font-size:21px; text-align:center; text-transform:uppercase; margin:0 0 14px; }
  .main { display:flex; gap:16px; align-items:flex-start; }
  .stage { flex:0 0 46%; background:#0b2230; border-radius:10px; padding:6px; }
  .panel { flex:1; min-width:0; }
  svg { display:block; width:100%; aspect-ratio:330/440; height:auto; touch-action:none; user-select:none; border-radius:6px; }
  #forceps { cursor:grab; } #forceps.drag { cursor:grabbing; }
  .ring { fill:none; stroke:#ffd54f; stroke-width:2; transform-box:fill-box; transform-origin:center; animation:pulse 1.2s ease-out infinite; }
  @keyframes pulse { 0%{transform:scale(.6);opacity:1} 100%{transform:scale(1.8);opacity:0} }
  @media (prefers-reduced-motion:reduce){ .ring{animation:none} }
  .steps { display:flex; flex-direction:column; gap:6px; margin-bottom:12px; }
  .step { font-size:13px; padding:6px 12px; border-radius:14px; background:rgba(255,255,255,.14); }
  .step.done { background:#4caf50; }
  .msg { font-size:15px; font-weight:bold; min-height:66px; margin-bottom:10px; line-height:1.35; }
  .box { background:rgba(255,255,255,.12); border-radius:8px; padding:12px 14px; margin-bottom:12px; font-size:14px; }
  .box.hide { display:none; }
  #oinfo { background:rgba(0,0,0,.2); border-radius:6px; padding:9px 12px; min-height:64px; margin:8px 0; }
  #chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { background:rgba(255,255,255,.18); padding:4px 9px; font-size:12px; border-radius:12px; }
  .chip.seen { background:#4caf50; }
  .btns { display:flex; gap:8px; flex-wrap:wrap; }
  button { background:#33a6b8; color:#fff; border:none; padding:8px 14px; border-radius:4px; font-size:12px; text-transform:uppercase; cursor:pointer; }
  button:disabled { opacity:.4; cursor:default; }
  button:focus-visible { outline:3px solid #ffd54f; outline-offset:2px; }
  .note { font-size:11px; color:#d6e3ea; font-style:italic; margin-top:12px; }
  @media (max-width:800px) { .main { flex-direction:column; } .stage { flex:none; width:100%; } .panel { width:100%; } }
</style>

    ['stomach', STO], ['liver', LIV], ['lungs', LUNG],
    ['intestines', [[[188,115],[215,95],[255,88],[295,100],[315,135],[310,180],[285,212],[250,215],[218,190],[196,150]]]]
  ];
  function curSet() { return (lift.done || lift.p > 0.5) ? HC : HB; }
  function inPoly(p, poly) { var c = false; for (var i = 0, j = poly.length - 1; i < poly.length; j = i++) { var a = poly[i], b = poly[j]; if (((a[1] > p.y) !== (b[1] > p.y)) && (p.x < (b[0] - a[0]) * (p.y - a[1]) / (b[1] - a[1]) + a[0])) c = !c; } return c; }
  function organAt() {
    if (!open.done) return null;
    var s = curSet();
    for (var i = 0; i < s.length; i++) for (var k = 0; k < s[i][1].length; k++) if (inPoly(tip, s[i][1][k])) return s[i][0];
    return null;
  }

  function clamp(v, a, b) { return Math.min(b, Math.max(a, v)); }
  function pt(e) { var p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }
  function find(id) { return ORG.filter(function (x) { return x.id === id; })[0]; }
  function select(id) {
    var o = find(id); if (!o) return;
    seen[id] = 1; cur = id; $('oinfo').textContent = o.n + ': ' + o.f;
  }
  function showTag() {
    var t = $('tag'), o = find(touching);
    if (!o) { t.style.display = 'none'; return; }
    var s = vb.w / W, w = (o.n.length * 8.4 + 18) * s, x = tip.x + 10 * s, y = tip.y - 34 * s;
    if (x + w > vb.x + vb.w - 2) x = tip.x - 10 * s - w;
    if (y < vb.y + 2) y = tip.y + 14 * s;
    $('tagBg').setAttribute('width', o.n.length * 8.4 + 18); $('tagTx').textContent = o.n;
    t.setAttribute('transform', 'translate(' + x.toFixed(1) + ',' + y.toFixed(1) + ') scale(' + s.toFixed(3) + ')'); t.style.display = '';
  }
  function setVB() { svg.setAttribute('viewBox', vb.x.toFixed(2) + ' ' + vb.y.toFixed(2) + ' ' + vb.w.toFixed(2) + ' ' + vb.h.toFixed(2)); }
  function zoomTo(t) {
    vbT = t;
    if (reduce) { vb = { x: t.x, y: t.y, w: t.w, h: t.h }; setVB(); draw(); return; }
    (function tick() {
      var d = 0; ['x', 'y', 'w', 'h'].forEach(function (k) { vb[k] += (vbT[k] - vb[k]) * 0.16; d += Math.abs(vbT[k] - vb[k]); });
      setVB(); draw();
      if (d > 0.4 && vbT === t) requestAnimationFrame(tick); else if (vbT === t) { vb = { x: t.x, y: t.y, w: t.w, h: t.h }; setVB(); draw(); }
    })();
  }

  function draw() {
    var s = vb.w / W;
    tip.x = clamp(tip.x, vb.x, vb.x + vb.w); tip.y = clamp(tip.y, vb.y, vb.y + vb.h);
    $('armL').setAttribute('x1', grip ? -0.6 : -7); $('armR').setAttribute('x1', grip ? 0.6 : 7);
    fp.setAttribute('transform', 'translate(' + tip.x.toFixed(1) + ',' + tip.y.toFixed(1) + ') rotate(-20) scale(' + (s * 0.62).toFixed(3) + ')');
    var w = 125 * (open.done ? 1 : open.p);
    $('rvr').setAttribute('x', MID - w); $('rvr').setAttribute('width', 2 * w);
    $('imgC').setAttribute('opacity', lift.done ? 1 : lift.p);
    $('ringG').style.display = (!open.done && !(grip && grip.kind === 'open')) ? '' : 'none';
    var hl = ''; var set = curSet();
    set.forEach(function (e) { if (e[0] === cur && lift.p % 1 === 0) e[1].forEach(function (poly) { hl += '<polygon points="' + poly.map(function (q) { return q.join(','); }).join(' ') + '" fill="rgba(255,213,79,.18)" stroke="#ffd54f" stroke-width="' + (1.4 * s).toFixed(2) + '" stroke-linejoin="round"/>'; }); });
    $('hl').innerHTML = hl;
    $('liftBtn').disabled = !open.done; $('liftBtn').textContent = lift.done ? 'Put intestines back' : 'Lift intestines';
    $('oleg').className = 'box' + (open.done ? '' : ' hide');
    var cnt = Object.keys(seen).length, N = ORG.length;
    $('chips').innerHTML = ORG.map(function (o) { return '<span class="chip' + (seen[o.id] ? ' seen' : '') + '">' + (seen[o.id] ? o.n : '?') + '</span>'; }).join('');
    var names = ['Pick up the forceps', 'Open the body wall', 'Lift the intestines', 'Touch every organ (' + cnt + '/' + N + ')'];
    var st = [picked, open.done, lift.done, cnt >= N];
    $('steps').innerHTML = names.map(function (t, i) { return '<span class="step' + (st[i] ? ' done' : '') + '">' + (st[i] ? '&#10003; ' : (i + 1) + '. ') + t + '</span>'; }).join('');
    $('msg').textContent = cnt >= N && lift.done ? 'You identified every organ. Great work!' :
      grip ? (grip.kind === 'lift' ? 'Holding the intestines. Pull them toward the pig\u2019s left (your right).' : 'Gripping the skin. Keep holding and pull it away from the midline.') :
      miss ? 'Not far enough. Grip it again and pull farther.' :
      open.done ? (lift.done ? 'Intestines lifted. Touch each organ with the forceps tip to identify it.' : 'The body cavity is open. Touch organs to identify them. Lift the intestines to see what is underneath.') :
      picked ? 'Carry the forceps to the pig\u2019s midline (the glowing dot). They grip automatically.' :
      'Click and drag the forceps from the left side of the photo.';
  }

  fp.addEventListener('pointerdown', function (e) {
    var p = pt(e); off = { x: tip.x - p.x, y: tip.y - p.y };
    fp.setPointerCapture(e.pointerId); fp.classList.add('drag'); picked = true; draw(); e.preventDefault();
  });
  fp.addEventListener('pointermove', function (e) {
    if (!off) return;
    var p = pt(e); tip.x = p.x + off.x; tip.y = p.y + off.y; tip.x = clamp(tip.x, vb.x, vb.x + vb.w); tip.y = clamp(tip.y, vb.y, vb.y + vb.h);
    if (grip) {
      if (grip.kind === 'open') open.p = clamp(Math.abs(tip.x - grip.startX) / 55, 0, 1);
      else lift.p = clamp((tip.x - grip.startX) / 45, 0, 1);
    } else if (!open.done && Math.abs(tip.x - MID) < 16 && tip.y > 110 && tip.y < 300) { grip = { kind: 'open', startX: tip.x }; miss = false; }
    touching = (grip && grip.kind === 'open') ? null : organAt();
    if (touching && touching !== cur) select(touching);
    if (!grip && open.done && !lift.done && touching === 'intestines') { grip = { kind: 'lift', startX: tip.x }; miss = false; }
    showTag(); draw();
  });
  function release() {
    if (!off) return;
    off = null; fp.classList.remove('drag'); touching = null; showTag();
    if (grip) {
      if (grip.kind === 'open') { if (open.p >= 0.7) { open.p = 1; open.done = true; zoomTo(ZOOM); } else { open.p = 0; miss = true; } }
      else { if (lift.p >= 0.7) { lift.p = 1; lift.done = true; } else { lift.p = 0; miss = true; } }
      grip = null;
    }
    draw();
  }
  fp.addEventListener('pointerup', release); fp.addEventListener('pointercancel', release);

  $('liftBtn').addEventListener('click', function () { lift.done = !lift.done; lift.p = lift.done ? 1 : 0; miss = false; cur = null; $('oinfo').textContent = 'Nothing touched yet.'; draw(); });
  $('reset').addEventListener('click', function () {
    open = { p: 0, done: false }; lift = { p: 0, done: false };
    tip = { x: REST.x, y: REST.y }; grip = null; off = null; picked = false; miss = false; seen = {}; cur = null; touching = null; showTag();
    $('oinfo').textContent = 'Nothing touched yet.'; vb = { x: 0, y: 0, w: W, h: H }; vbT = BASE; setVB(); draw();
  });
  setVB(); draw();
})();
</script>
